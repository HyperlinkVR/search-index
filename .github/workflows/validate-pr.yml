name: validate-pr

on:
  pull_request:
    paths:
      - "worlds/**"

permissions:
  contents: read
  pull-requests: write # post the validation report as a PR comment

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit to diff against

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine changed world entries
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'worlds/*.json' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed: $files"

      - name: Validate changed entries
        id: validate
        continue-on-error: true # let the comment step run first, then fail the job below
        env:
          FILES: ${{ steps.changed.outputs.files }}
          # link explainer docs to the docs/ folder on the PR's target branch
          DOCS_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/docs
        run: pnpm run validate -- $FILES

      - name: Comment validation results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- hvr-validation -->";
            let body;
            try {
              body = fs.readFileSync("validation-report.md", "utf8");
            } catch {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body = `${marker}\n## World entry validation\n\n⚠️ The validation step did not produce a report (it may have crashed before finishing). See the [workflow logs](${runUrl}).`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
